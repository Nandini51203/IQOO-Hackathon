name: rakshasense_sensor_module
description: >
  RakshaSense – Sensor & Trigger Engine (Member 1).
  Standalone Flutter prototype: accelerometer/gyroscope input ->
  rolling buffer -> fall-detection state machine -> confidence score ->
  onFallDetected callback.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Maintained cross-platform accelerometer/gyroscope streams.
  # If `flutter pub get` resolves a newer major version, check the
  # sensors_plus changelog — the stream API (accelerometerEventStream /
  # gyroscopeEventStream) has been stable since 4.x.
  sensors_plus: ^6.0.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

name: rakshasense
description: RakshaSense - Phone-based safety and emergency response system.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Member 1 - Sensor & Fall Detection
  sensors_plus: ^6.0.1

  # Member 2 - Check-in UI
  wakelock_plus: ^1.2.8

  # Member 3 - Location & SMS Escalation
  geolocator: ^13.0.1
  flutter_background: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
